name: Daily Strategy Execution & Pages Sync

on:
  schedule:
    # GitHub cron is best-effort: triggers are often late by hours or dropped entirely.
    # Several attempts are scheduled; the first one inside the 15:45-23:59 ET window does
    # the work and later ones exit immediately (already ran today). Odd minutes avoid peak load.
    - cron: '50 19 * * 1-5'   # 15:50 EDT / 14:50 EST (skips in winter)
    - cron: '50 20 * * 1-5'   # 16:50 EDT / 15:50 EST
    - cron: '17 22 * * 1-5'   # 18:17 EDT / 17:17 EST (retry)
    - cron: '17 0 * * 2-6'    # 20:17 EDT / 19:17 EST (retry, UTC is next day)
    - cron: '17 2 * * 2-6'    # 22:17 EDT / 21:17 EST (last retry)
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass market-hours check'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "strategy-execution"
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Unit Tests
        run: |
          python -m pytest -q tests

      - name: Execute Daily Strategy & Sync Pages
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python run_cloud_strategy.py

      - name: Commit and Push State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state*.json daily_summary*.csv trade_log*.csv strategy*.log performance_chart.png docs/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Auto: Daily Strategy Execution [skip ci]"
          git pull --rebase origin main
          git push origin main


