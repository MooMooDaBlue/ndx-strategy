name: Daily Strategy Execution & Pages Sync

on:
  schedule:
    # 19:50 UTC = 15:50 EDT (summer) / 14:50 EST (winter, in-window check skips until 20:50)
    - cron: '50 19 * * 1-5'
    # 20:50 UTC = 16:50 EDT (in-window) / 15:50 EST (winter, inside 15:45-17:30 ET window)
    - cron: '50 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass market-hours check'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "strategy-execution"
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Unit Tests
        run: |
          python -m pytest -q tests

      - name: Execute Daily Strategy & Sync Pages
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: |
          python run_cloud_strategy.py

      - name: Commit and Push State Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state*.json daily_summary*.csv trade_log*.csv strategy*.log performance_chart.png docs/
          git pull --rebase origin main
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Daily Strategy Execution [skip ci]" && git push origin main)


